<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <title>laporan keuangan</title>
</head>
<body>

<div class="container">
  <div class="row">
    <form th:action="@{/customer/post-keuangan}" method="post">
      <div class="card">
        <div class="card-body p-4">
          <div class="form-group">
            <label for="kas">Kas / setara kas</label>
            <input type="text" class="form-control formatted-value" id="kas"
                   th:field="${lapKeuRequestDto.kas}"
                   placeholder="">
            <p th:if="${#fields.hasErrors('lapKeuRequestDto.kas')}" th:errorclass="text-danger"
               th:errors="${lapKeuRequestDto.kas}">
            </p>
          </div>

          <div class="form-group">
            <label for="piutang">Piutang</label>
            <input type="text" class="form-control formatted-value" id="piutang"
                   th:field="${lapKeuRequestDto.piutang}"
                   placeholder="">
            <p th:if="${#fields.hasErrors('lapKeuRequestDto.piutang')}" th:errorclass="text-danger"
               th:errors="${lapKeuRequestDto.piutang}">
            </p>
          </div>

          <div class="form-group">
            <label for="persediaan">Persediaan</label>
            <input type="text" class="form-control formatted-value" id="persediaan"
                   th:field="${lapKeuRequestDto.persediaan}"
                   placeholder="">
            <p th:if="${#fields.hasErrors('lapKeuRequestDto.persediaan')}" th:errorclass="text-danger"
               th:errors="${lapKeuRequestDto.persediaan}">
            </p>
          </div>

          <div class="form-group">
            <label for="asetLancar">Aset Lancar</label>
            <input type="text" class="form-control formatted-value" id="asetLancar"
                   th:field="${lapKeuRequestDto.asetLancar}"
                   placeholder="">
            <p th:if="${#fields.hasErrors('lapKeuRequestDto.asetLancar')}" th:errorclass="text-danger"
               th:errors="${lapKeuRequestDto.asetLancar}">
            </p>
          </div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const inputs = document.querySelectorAll(".formatted-value");

    const formatNumber = (value) => {
      let cleaned = value.replace(/,/g, ''); // Hapus koma ribuan (jika ada dari copy-paste)
      const number = parseFloat(cleaned);
      if (isNaN(number)) return '';

      return new Intl.NumberFormat('en-US', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }).format(number);
    };

    const unformatNumber = (value) => {
      return value.replace(/,/g, ''); // Hapus koma ribuan
    };

    inputs.forEach(input => {
      // Format value dari backend (misal 1700.75)
      if (input.value) {
        input.value = formatNumber(input.value); // Format dengan koma ribuan
      }

      // Format saat user mengetik
      input.addEventListener('input', () => {
        const raw = input.value.replace(/[^0-9.]/g, ''); // Hanya angka dan titik (desimal)
        input.value = formatNumber(raw);
      });
    });

    // Sebelum form submit, ubah kembali ke format backend (tanpa koma ribuan)
    const form = document.querySelector("form");
    if (form) {
      form.addEventListener("submit", () => {
        inputs.forEach(input => {
          input.value = unformatNumber(input.value); // Hilangkan koma ribuan
        });
      });
    }
  });
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

</body>
</html>
